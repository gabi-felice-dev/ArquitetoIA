name: arquiteto-ia

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bd_arquiteto_ia
      POSTGRES_USER: coti
      POSTGRES_PASSWORD: coti
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coti -d bd_arquiteto_ia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== NOVO: memória conversacional =====
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: coti
      MONGO_INITDB_ROOT_PASSWORD: coti
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      # Conexão com o Mongo (usa o nome do serviço "mongo" na rede do compose)
      ME_CONFIG_MONGODB_URL: mongodb://coti:coti@mongo:27017/?authSource=admin
      ME_CONFIG_MONGODB_ADMINUSERNAME: coti
      ME_CONFIG_MONGODB_ADMINPASSWORD: coti
      # Login da interface web
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: coti
      ME_CONFIG_BASICAUTH_PASSWORD: coti
    ports:
      - "127.0.0.1:8081:8081"   # Interface web (http://localhost:8081)
    depends_on:
      mongo:
        condition: service_healthy

  # ===== NOVO: servidor SMTP falso para simular e-mail =====
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP (a API envia aqui)
      - "127.0.0.1:8025:8025"   # Interface web (caixa de entrada)

volumes:
  postgres_data:
  pgadmin_data:
  mongo_data: